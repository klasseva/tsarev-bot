{# templates/_embed_preview.html #}
{% set c = color or '#5865F2' %}
<div class="flex bg-[#2b2d31] rounded-lg overflow-hidden" style="border-left: 4px solid {{ c }};">
  <div class="flex-1 p-4">
    {% if title %}<div class="font-bold text-white mb-1">{{ title }}</div>{% endif %}
    {% if description %}<div class="text-sm text-gray-200 whitespace-pre-wrap mb-2">{{ description }}</div>{% endif %}
    {% if image %}<img src="{{ image }}" class="max-w-full rounded mt-2" alt="">{% endif %}
    {% if footer %}<div class="text-xs text-gray-400 mt-3">{{ footer }}</div>{% endif %}
  </div>
  {% if thumbnail %}
  <div class="p-4"><img src="{{ thumbnail }}" class="w-20 h-20 rounded object-cover" alt=""></div>
  {% endif %}
</div>
