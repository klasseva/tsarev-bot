{% extends 'base.html' %}
{% block title %}Мониторинг{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-3xl font-bold">📡 Мониторинг Majestic RP</h1>
</div>

<details class="bg-panel border border-border rounded-xl p-6 mb-6">
  <summary class="cursor-pointer font-bold">+ Новая панель мониторинга</summary>
  <form method="post" action="/monitor/create" class="grid grid-cols-2 gap-4 mt-4">
    <input name="guild_id" type="number" placeholder="Guild ID" required class="bg-bg border border-border rounded px-3 py-2">
    <input name="channel_id" type="number" placeholder="Channel ID" required class="bg-bg border border-border rounded px-3 py-2">
    <input name="server_ids" placeholder="ID серверов через запятую (1,3,5)" required class="col-span-2 bg-bg border border-border rounded px-3 py-2">
    <button class="col-span-2 bg-green-600 hover:bg-green-700 rounded py-2">Создать</button>
  </form>
</details>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  {% for p in panels %}
    <div class="bg-panel border border-border rounded-xl p-5">
      <div class="font-bold">Панель #{{ p.id }}</div>
      <div class="text-sm text-gray-400 mb-2">Серверы: {{ p.server_ids }}</div>
      <div class="text-xs text-gray-500 mb-3">Канал: {{ p.channel_id }}</div>
      <form method="post" action="/monitor/{{ p.id }}/delete" onsubmit="return confirm('Удалить?')">
        <button class="text-red-400 text-sm hover:underline">Удалить</button>
      </form>
    </div>
  {% else %}
    <p class="text-gray-500 col-span-2">Панелей пока нет.</p>
  {% endfor %}
</div>
{% endblock %}
