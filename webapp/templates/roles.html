{# templates/roles.html #}
{% extends 'base.html' %}
{% block title %}Роли{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-3xl font-bold">🎚️ Роли по кнопке</h1>
</div>

<details class="bg-panel border border-border rounded-xl p-6 mb-6">
  <summary class="cursor-pointer font-bold">+ Новая панель</summary>
  <form method="post" action="/roles/create" class="grid grid-cols-2 gap-4 mt-4">
    <input name="guild_id" type="number" placeholder="Guild ID" required class="bg-bg border border-border rounded px-3 py-2">
    <input name="channel_id" type="number" placeholder="Channel ID" required class="bg-bg border border-border rounded px-3 py-2">
    <input name="title" placeholder="Заголовок" required class="col-span-2 bg-bg border border-border rounded px-3 py-2">
    <textarea name="description" placeholder="Описание" class="col-span-2 bg-bg border border-border rounded px-3 py-2"></textarea>
    <input name="color" value="#5865F2" class="bg-bg border border-border rounded px-3 py-2">
    <label class="flex items-center gap-2 px-3 py-2"><input type="checkbox" name="multi" checked> Мультивыбор</label>
    <button class="col-span-2 bg-green-600 hover:bg-green-700 rounded py-2">Создать</button>
  </form>
</details>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  {% for p in panels %}
    <div class="bg-panel border border-border rounded-xl p-5">
      <div class="font-bold text-lg mb-1"># p.id  ·  p.title </div>
      <div class="text-xs text-gray-400 mb-3">Канал:  p.channel_id  · Цвет:  p.color </div>
      <button hx-get="/roles/ p.id " hx-target="#panel-detail" hx-swap="innerHTML"
              class="text-primary text-sm hover:underline">Настроить роли</button>
    </div>
  {% endfor %}
</div>

<div id="panel-detail" class="mt-6"></div>
{% endblock %}
