<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsarev Bot Admin</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e0e10;
            color: #e6e6e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            background: #1a1a1d;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .crown { font-size: 48px; margin-bottom: 16px; }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { color: #a0a0a0; margin: 0 0 24px; }
        .discord-btn {
            display: inline-block;
            background: #5865F2;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .discord-btn:hover { background: #4752c4; }
        .error {
            background: #3a1a1a;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="crown">👑</div>
        <h1>Tsarev Bot Admin</h1>
        <p>Войдите через Discord, чтобы управлять ботом.</p>

        {% if error %}
            <div class="error">\{\{ error \}\}</div>
        {% endif %}

        <a href="\{\{ oauth_url \}\}" class="discord-btn">
            Войти через Discord
        </a>
    </div>
</body>
</html>
